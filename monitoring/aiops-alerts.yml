groups:
  - name: opentenbase-aiops
    rules:
      - alert: OpenTenBaseAuditHighRisk
        expr: aiops_health_audit_scope_risk{job="opentenbase-aiops",level=~"high|critical"} == 1
        for: 1m
        annotations:
          summary: "Latest OpenTenBase {{ $labels.scope }} audit reports {{ $labels.level }} risk"
      - alert: OpenTenBaseAuditOverdue
        expr: |
          (time() - aiops_health_audit_latest_scheduled_timestamp_seconds{job="opentenbase-aiops"}
            > 2 * aiops_health_audit_interval_seconds{job="opentenbase-aiops"})
          and aiops_health_audit_schedule_enabled{job="opentenbase-aiops"} == 1
        for: 2m
        annotations:
          summary: "OpenTenBase health audit is overdue"
      - alert: OpenTenBaseAuditMetricsUnavailable
        expr: up{job="opentenbase-aiops"} == 0
        for: 2m
        annotations:
          summary: "Prometheus cannot scrape OpenTenBase AIOps metrics"
      - alert: OpenTenBaseAuditCollectionDegraded
        expr: |
          aiops_health_audit_scheduled_collection_degraded{job="opentenbase-aiops"} == 1
          and aiops_health_audit_schedule_enabled{job="opentenbase-aiops"} == 1
        for: 2m
        annotations:
          summary: "Latest scheduled OpenTenBase audit could not collect all checks"
      - alert: OpenTenBaseAuditAnalysisDegraded
        expr: |
          aiops_health_audit_scheduled_analysis_degraded{job="opentenbase-aiops"} == 1
          and aiops_health_audit_schedule_enabled{job="opentenbase-aiops"} == 1
        for: 2m
        annotations:
          summary: "Latest scheduled OpenTenBase audit used fallback diagnosis for at least one target"
      - alert: OpenTenBaseRepairReviewRequired
        expr: aiops_repair_review_count{job="opentenbase-aiops"} > 0
        for: 1m
        annotations:
          summary: "OpenTenBase repair requests require manual review"
