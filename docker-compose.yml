services:
  knowledge-db:
    image: pgvector/pgvector:pg16
    container_name: opentenbase-aiops-knowledge-db
    networks:
      - otb-lab-net
    environment:
      POSTGRES_DB: aiops_knowledge
      POSTGRES_USER: aiops_knowledge
      POSTGRES_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:-aiops-local-dev-only}
    volumes:
      - knowledge-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops_knowledge -d aiops_knowledge"]
      interval: 5s
      timeout: 3s
      retries: 20

  aiops-service:
    build: .
    container_name: opentenbase-aiops
    networks:
      - otb-lab-net
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      - DB_HOST=${DB_HOST:-otb-node1}
      - DB_PORT=${DB_PORT:-11003}
      - DB_USER=${DB_USER:-opentenbase}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_TIMEOUT_SECONDS=${DEEPSEEK_TIMEOUT_SECONDS:-150}
      - AIOPS_SAFETY_REVIEW_MODEL=${AIOPS_SAFETY_REVIEW_MODEL:-}
      - AIOPS_SAFETY_REVIEW_API_KEY=${AIOPS_SAFETY_REVIEW_API_KEY:-}
      - AIOPS_SAFETY_REVIEW_API_BASE=${AIOPS_SAFETY_REVIEW_API_BASE:-}
      - AIOPS_SAFETY_REVIEW_PROVIDER=${AIOPS_SAFETY_REVIEW_PROVIDER:-}
      - AIOPS_HEALTH_AUDIT_HTTP_TIMEOUT_SECONDS=${AIOPS_HEALTH_AUDIT_HTTP_TIMEOUT_SECONDS:-210}
      - AIOPS_COLLECTION_STATEMENT_TIMEOUT_MS=${AIOPS_COLLECTION_STATEMENT_TIMEOUT_MS:-2500}
      - AIOPS_COLLECTION_LOCK_TIMEOUT_MS=${AIOPS_COLLECTION_LOCK_TIMEOUT_MS:-750}
      - AIOPS_PG_CLEAN_MIN_AGE_SECONDS=${AIOPS_PG_CLEAN_MIN_AGE_SECONDS:-10}
      - AIOPS_APPROVER_ID=${AIOPS_APPROVER_ID:-local-operator}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_API_BASE=${EMBEDDING_API_BASE:-https://api.siliconflow.cn/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1024}
      - KNOWLEDGE_DB_HOST=knowledge-db
      - KNOWLEDGE_DB_PORT=5432
      - KNOWLEDGE_DB_NAME=aiops_knowledge
      - KNOWLEDGE_DB_USER=aiops_knowledge
      - KNOWLEDGE_DB_PASSWORD=${KNOWLEDGE_DB_PASSWORD:-aiops-local-dev-only}
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./data:/app/data
      - aiops-data:/app/data/embeddings
    restart: unless-stopped
    depends_on:
      - aiops-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  aiops-api:
    build: .
    container_name: opentenbase-aiops-api
    networks:
      - otb-lab-net
    depends_on:
      knowledge-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - AIOPS_APPROVAL_TOKEN=${AIOPS_APPROVAL_TOKEN:-}
      - AIOPS_REPAIR_DB_USER=${AIOPS_REPAIR_DB_USER:-}
      - AIOPS_REPAIR_DB_PASSWORD=${AIOPS_REPAIR_DB_PASSWORD:-}
      - AIOPS_REPAIR_FUNCTION_ENABLED=${AIOPS_REPAIR_FUNCTION_ENABLED:-false}
      - AIOPS_REPAIR_FUNCTION_SCHEMA=${AIOPS_REPAIR_FUNCTION_SCHEMA:-aiops_admin}
      - AIOPS_REPAIR_FUNCTION_NAME=${AIOPS_REPAIR_FUNCTION_NAME:-analyze_table}
      - AIOPS_CANCEL_QUERY_ENABLED=${AIOPS_CANCEL_QUERY_ENABLED:-false}
      - AIOPS_AUTO_REPAIR_ENABLED=${AIOPS_AUTO_REPAIR_ENABLED:-false}
      - AIOPS_AUTO_REPAIR_TARGETS=${AIOPS_AUTO_REPAIR_TARGETS:-}
      - AIOPS_APPROVER_TOKENS=${AIOPS_APPROVER_TOKENS:-}
      - AIOPS_APPROVER_ID=${AIOPS_APPROVER_ID:-local-operator}
      - AIOPS_AUTO_AUDIT_ENABLED=${AIOPS_AUTO_AUDIT_ENABLED:-true}
      - DEEPSEEK_TIMEOUT_SECONDS=${DEEPSEEK_TIMEOUT_SECONDS:-150}
      - AIOPS_AI_AUDIT_TIMEOUT_SECONDS=${AIOPS_AI_AUDIT_TIMEOUT_SECONDS:-120}
      - AIOPS_COLLECTION_STATEMENT_TIMEOUT_MS=${AIOPS_COLLECTION_STATEMENT_TIMEOUT_MS:-2500}
      - AIOPS_COLLECTION_LOCK_TIMEOUT_MS=${AIOPS_COLLECTION_LOCK_TIMEOUT_MS:-750}
      - AIOPS_PG_CLEAN_MIN_AGE_SECONDS=${AIOPS_PG_CLEAN_MIN_AGE_SECONDS:-10}
      - AIOPS_AUTO_AUDIT_INTERVAL_SECONDS=${AIOPS_AUTO_AUDIT_INTERVAL_SECONDS:-900}
      - AIOPS_AUTO_AUDIT_TABLE=${AIOPS_AUTO_AUDIT_TABLE:-}
      - AIOPS_DATA_NODE_TABLE_LIMIT=${AIOPS_DATA_NODE_TABLE_LIMIT:-200}
      - AIOPS_SLOW_QUERY_LOG_LOOKBACK_SECONDS=${AIOPS_SLOW_QUERY_LOG_LOOKBACK_SECONDS:-900}
      - DB_HOST=${DB_HOST:-otb-node1}
      - DB_PORT=${DB_PORT:-11003}
      - DB_USER=${DB_USER:-opentenbase}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - AIOPS_SAFETY_REVIEW_MODEL=${AIOPS_SAFETY_REVIEW_MODEL:-}
      - AIOPS_SAFETY_REVIEW_API_KEY=${AIOPS_SAFETY_REVIEW_API_KEY:-}
      - AIOPS_SAFETY_REVIEW_API_BASE=${AIOPS_SAFETY_REVIEW_API_BASE:-}
      - AIOPS_SAFETY_REVIEW_PROVIDER=${AIOPS_SAFETY_REVIEW_PROVIDER:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_API_BASE=${EMBEDDING_API_BASE:-https://api.siliconflow.cn/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1024}
      - KNOWLEDGE_DB_HOST=knowledge-db
      - KNOWLEDGE_DB_PORT=5432
      - KNOWLEDGE_DB_NAME=aiops_knowledge
      - KNOWLEDGE_DB_USER=aiops_knowledge
      - KNOWLEDGE_DB_PASSWORD=${KNOWLEDGE_DB_PASSWORD:-aiops-local-dev-only}
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./data:/app/data
      - aiops-data:/app/data/embeddings
    command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/health']
    restart: unless-stopped

networks:
  otb-lab-net:
    external: true

volumes:
  aiops-data:
  knowledge-db-data:
